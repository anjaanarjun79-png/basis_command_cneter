<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basis Command Center — SAP Basis Troubleshooting Academy</title>
    <script>
      (function() {
        try {
          const raw = localStorage.getItem('basis_command_center_settings_v1');
          if (raw) {
            const parsed = JSON.parse(raw);
            const theme = parsed.theme || 'light';
            let isDark = false;
            if (theme === 'system') {
              isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            } else {
              isDark = theme === 'dark';
            }
            if (isDark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }

            // Preset OKLCH scales map
            const presetScales = {
              indigo: {
                50: "oklch(96.2% 0.018 272.314)", 100: "oklch(93% 0.034 272.788)", 200: "oklch(87% 0.065 274.039)",
                300: "oklch(78.5% 0.115 274.713)", 400: "oklch(67.3% 0.182 276.935)", 500: "oklch(58.5% 0.233 277.117)",
                600: "oklch(51.1% 0.262 276.966)", 700: "oklch(45.7% 0.24 277.023)", 800: "oklch(39.8% 0.195 277.366)",
                900: "oklch(35.9% 0.144 278.697)", 950: "oklch(25.7% 0.09 281.288)"
              },
              blue: {
                50: "oklch(97% 0.014 254.604)", 100: "oklch(93.2% 0.032 255.585)", 200: "oklch(88.2% 0.059 254.128)",
                300: "oklch(80.9% 0.105 251.813)", 400: "oklch(70.7% 0.165 254.624)", 500: "oklch(62.3% 0.214 259.815)",
                600: "oklch(54.6% 0.245 262.881)", 700: "oklch(48.8% 0.243 264.376)", 800: "oklch(42.4% 0.199 265.638)",
                900: "oklch(37.9% 0.146 265.522)", 950: "oklch(28.2% 0.091 267.935)"
              },
              emerald: {
                50: "oklch(97.9% 0.021 166.113)", 100: "oklch(95% 0.052 163.051)", 200: "oklch(90.5% 0.093 164.15)",
                300: "oklch(84.5% 0.143 164.978)", 400: "oklch(76.5% 0.177 163.223)", 500: "oklch(69.6% 0.17 162.48)",
                600: "oklch(59.6% 0.145 163.225)", 700: "oklch(50.8% 0.118 165.612)", 800: "oklch(43.2% 0.095 166.913)",
                900: "oklch(37.8% 0.077 168.94)", 950: "oklch(26.2% 0.051 172.552)"
              },
              teal: {
                50: "oklch(98.4% 0.014 180.72)", 100: "oklch(95.3% 0.051 180.801)", 200: "oklch(91% 0.096 180.426)",
                300: "oklch(85.5% 0.138 181.071)", 400: "oklch(77.7% 0.152 181.912)", 500: "oklch(70.4% 0.14 182.503)",
                600: "oklch(60% 0.118 184.704)", 700: "oklch(51.1% 0.096 186.391)", 800: "oklch(43.7% 0.078 188.216)",
                900: "oklch(38.6% 0.063 188.416)", 950: "oklch(27.7% 0.046 192.524)"
              },
              violet: {
                50: "oklch(96.9% 0.016 293.756)", 100: "oklch(94.3% 0.029 294.588)", 200: "oklch(89.4% 0.057 293.283)",
                300: "oklch(81.1% 0.111 293.571)", 400: "oklch(70.2% 0.183 293.541)", 500: "oklch(60.6% 0.25 292.717)",
                600: "oklch(54.1% 0.281 293.009)", 700: "oklch(49.1% 0.27 292.581)", 800: "oklch(43.2% 0.232 292.759)",
                900: "oklch(38% 0.189 293.745)", 950: "oklch(28.3% 0.141 291.089)"
              },
              rose: {
                50: "oklch(96.9% 0.015 12.422)", 100: "oklch(94.1% 0.03 12.58)", 200: "oklch(89.2% 0.058 10.001)",
                300: "oklch(81% 0.117 11.638)", 400: "oklch(71.2% 0.194 13.428)", 500: "oklch(64.5% 0.246 16.439)",
                600: "oklch(58.6% 0.253 17.585)", 700: "oklch(51.4% 0.222 16.935)", 800: "oklch(45.5% 0.188 13.697)",
                900: "oklch(41% 0.159 10.272)", 950: "oklch(27.1% 0.105 12.094)"
              },
              amber: {
                50: "oklch(98.7% 0.022 95.277)", 100: "oklch(96.2% 0.059 95.617)", 200: "oklch(92.4% 0.12 95.746)",
                300: "oklch(87.9% 0.169 91.605)", 400: "oklch(82.8% 0.189 84.429)", 500: "oklch(76.9% 0.188 70.08)",
                600: "oklch(66.6% 0.179 58.318)", 700: "oklch(55.5% 0.163 48.998)", 800: "oklch(47.3% 0.137 46.201)",
                900: "oklch(41.4% 0.112 45.904)", 950: "oklch(27.9% 0.077 45.635)"
              }
            };

            const accent = parsed.accentColor || 'indigo';
            if (presetScales[accent]) {
              const sc = presetScales[accent];
              const root = document.documentElement;
              for (const k in sc) {
                root.style.setProperty('--color-indigo-' + k, sc[k]);
              }
              root.style.setProperty('--accent', isDark ? sc[500] : sc[600]);
              root.style.setProperty('--accent-hover', isDark ? sc[400] : sc[700]);
              root.style.setProperty('--accent-subtle', isDark ? sc[950] : sc[50]);
              root.style.setProperty('--accent-border', isDark ? sc[800] : sc[200]);
            }
          }
        } catch (e) {
          // ignore error and proceed with default
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
